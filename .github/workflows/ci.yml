name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -v -o aq ./cmd/aq

      - name: Test CLI Sanity
        run: |
          ./aq --version
          ./aq --help
